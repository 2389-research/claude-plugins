name: Check Plugin Installs

# Runs apart from the site build, so a broken plugin repo never stops the site from updating.
on:
  schedule:
    - cron: '53 6 * * 3'  # Weekly on Wednesday at 6:53 AM UTC, half an hour after the site build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'  # the skills CLI that npx runs needs Node 22.20 or later

      - name: Test the check against real npx
        run: node --test tests/install-checks.e2e.test.js

      - name: Check every marketplace entry
        run: node scripts/check-plugin-installs.js
