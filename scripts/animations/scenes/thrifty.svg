<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">THRIFTY</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">THE EXPENSIVE MODEL PLANS AND CHECKS · THE CHEAP ONE DOES THE TYPING</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M200,196 H260"/>
      <path d="M450,196 H510 V132 H570"/>
      <path d="M450,196 H510 V196 H570"/>
      <path d="M450,196 H510 V260 H570"/>
      <path d="M750,132 H810 V196 H870"/>
      <path d="M750,196 H870"/>
      <path d="M750,260 H810 V196 H870"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <rect x="60" y="166" width="140" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="130" y="201" font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">SPEC</text>
    </g>

    <path d="M200,196 H260" fill="none" stroke="#7a3fb0" stroke-width="1.5"
          stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.10;0.16;0.95;1" values="60;60;0;0;60"/>
    </path>

    <!-- the good model, used only where judgement is needed -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.14;0.24;0.95;1" values="0;0;1;1;0"/>
      <rect x="260" y="166" width="190" height="60" fill="#7a3fb0"/>
      <text x="355" y="192" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">SONNET</text>
      <text x="355" y="212" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">plans sprints</text>
    </g>

    <g fill="none" stroke="#7a3fb0" stroke-width="1.5">
      <path d="M450,196 H510 V132 H570" stroke-dasharray="184" stroke-dashoffset="184">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.24;0.32;0.95;1" values="184;184;0;0;184"/>
      </path>
      <path d="M450,196 H570" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.24;0.32;0.95;1" values="120;120;0;0;120"/>
      </path>
      <path d="M450,196 H510 V260 H570" stroke-dasharray="184" stroke-dashoffset="184">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.24;0.32;0.95;1" values="184;184;0;0;184"/>
      </path>
    </g>

    <!-- the cheap model, doing the volume -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.32;0.42;0.95;1" values="0;0;1;1;0"/>
      <text x="660" y="104" font-size="11" letter-spacing="1.6" fill="#767168" text-anchor="middle">HAIKU · BUILDS EACH SPRINT</text>
      <g fill="#ffffff" stroke="#7a3fb0" stroke-width="1.5">
        <rect x="570" y="110" width="180" height="44"/>
        <rect x="570" y="174" width="180" height="44"/>
        <rect x="570" y="238" width="180" height="44"/>
      </g>
      <g font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">
        <text x="660" y="137">SPRINT 1</text>
        <text x="660" y="201">SPRINT 2</text>
        <text x="660" y="265">SPRINT 3</text>
      </g>
    </g>

    <g fill="none" stroke="#7a3fb0" stroke-width="1.5">
      <path d="M750,132 H810 V196 H870" stroke-dasharray="184" stroke-dashoffset="184">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.58;0.95;1" values="184;184;0;0;184"/>
      </path>
      <path d="M750,196 H870" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.58;0.95;1" values="120;120;0;0;120"/>
      </path>
      <path d="M750,260 H810 V196 H870" stroke-dasharray="184" stroke-dashoffset="184">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.58;0.95;1" values="184;184;0;0;184"/>
      </path>
    </g>

    <!-- back to the good model to say whether it is actually done -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.58;0.68;0.95;1" values="0;0;1;1;0"/>
      <rect x="870" y="166" width="190" height="60" fill="#7a3fb0"/>
      <text x="965" y="192" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">SONNET</text>
      <text x="965" y="212" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">reviews</text>
    </g>

    <!-- the ledger: most of the work billed at the cheap rate -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.66;0.76;0.95;1" values="0;0;1;1;0"/>
      <text x="260" y="300" font-size="11" letter-spacing="1.4" fill="#767168">WORK DONE, BY RATE</text>
      <rect x="260" y="310" width="620" height="20" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <rect x="260" y="310" width="150" height="20" fill="#7a3fb0"/>
      <rect x="410" y="310" width="470" height="20" fill="#7a3fb0" opacity="0.24"/>
      <text x="896" y="325" font-size="11" letter-spacing="1.2" fill="#767168">CHEAP TIER CARRIES IT</text>
    </g>
  </g>
</svg>
