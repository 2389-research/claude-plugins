<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">DOCUMENTATION-AUDIT</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">EXTRACT CLAIMS · MATCH AGAINST CODE · REPORT THE DRIFT</text>

    <rect x="60" y="100" width="340" height="200" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="60" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">DOCS · CLAIMS</text>
    <rect x="800" y="100" width="340" height="200" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="800" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">CODE · REALITY</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M400,132 H600 V176 H800"/>
      <path d="M400,176 H600 V132 H800"/>
      <path d="M400,220 H600 V264 H800"/>
      <path d="M400,264 H510"/>
    </g>

    <!-- claims lifted out of the docs -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.12;0.95;1" values="0;0;1;1;0"/>
      <g font-size="12" fill="#33302a">
        <text x="84" y="137">--strict flag</text>
        <text x="84" y="181">exports run()</text>
        <text x="84" y="225">retries 3x</text>
        <text x="84" y="269">v2 endpoint</text>
      </g>
    </g>

    <!-- what the code actually contains -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.06;0.16;0.95;1" values="0;0;1;1;0"/>
      <g font-size="12" fill="#33302a">
        <text x="824" y="137">export run()</text>
        <text x="824" y="181">opts.strict</text>
        <text x="824" y="225">v1 only</text>
        <text x="824" y="269">retry(3)</text>
      </g>
    </g>

    <!-- three claims land somewhere; the crossings are what a real audit looks like -->
    <g fill="none" stroke="#2f7d8c" stroke-width="1.5">
      <path d="M400,132 H600 V176 H800" stroke-dasharray="444" stroke-dashoffset="444">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.18;0.30;0.95;1" values="444;444;0;0;444"/>
      </path>
      <path d="M400,176 H600 V132 H800" stroke-dasharray="444" stroke-dashoffset="444">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.22;0.34;0.95;1" values="444;444;0;0;444"/>
      </path>
      <path d="M400,220 H600 V264 H800" stroke-dasharray="444" stroke-dashoffset="444">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.26;0.38;0.95;1" values="444;444;0;0;444"/>
      </path>
    </g>

    <!-- the fourth claim has nothing to land on -->
    <path d="M400,264 H510" fill="none" stroke="#e6196e" stroke-width="1.5"
          stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.44;0.54;0.95;1" values="110;110;0;0;110"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.54;0.64;0.95;1" values="0;0;1;1;0"/>
      <rect x="80" y="252" width="230" height="22" fill="#e6196e" opacity="0.16"/>
      <text x="322" y="269" font-size="11" letter-spacing="1.2" fill="#e6196e">STALE</text>
      <g stroke="#e6196e" stroke-width="2">
        <line x1="520" y1="256" x2="536" y2="272"/>
        <line x1="536" y1="256" x2="520" y2="272"/>
      </g>
      <text x="430" y="240" font-size="11" letter-spacing="1.4" fill="#e6196e">NO MATCH</text>
    </g>

    <!-- verdict -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.68;0.78;0.95;1" values="0;0;1;1;0"/>
      <rect x="430" y="312" width="340" height="32" fill="#2f7d8c"/>
      <text x="600" y="333" font-size="12" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">3 VERIFIED · 1 DRIFTED</text>
    </g>
  </g>
</svg>
