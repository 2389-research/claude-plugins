<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">LANDING-PAGE-DESIGN</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">SECTION BY SECTION · NO AI SLOP · BUILT TO CONVERT</text>

    <!-- page frame, allocated before any section arrives -->
    <rect x="60" y="100" width="400" height="240" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="60" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">PAGE</text>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.06;0.15;0.95;1" values="0;0;1;1;0"/>
      <rect x="80" y="118" width="360" height="70" fill="#171512"/>
      <text x="100" y="158" font-size="12" letter-spacing="1.6" fill="#faf9f6">HERO</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.16;0.25;0.95;1" values="0;0;1;1;0"/>
      <rect x="80" y="198" width="360" height="36" fill="#e7e3da"/>
      <text x="100" y="221" font-size="12" letter-spacing="1.6" fill="#4a453b">PROOF</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.26;0.35;0.95;1" values="0;0;1;1;0"/>
      <rect x="80" y="244" width="360" height="36" fill="#e7e3da"/>
      <text x="100" y="267" font-size="12" letter-spacing="1.6" fill="#4a453b">FEATURES</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.36;0.45;0.95;1" values="0;0;1;1;0"/>
      <rect x="80" y="290" width="360" height="32" fill="#e6196e"/>
      <text x="100" y="311" font-size="12" letter-spacing="1.6" fill="#ffffff">CTA</text>
    </g>

    <!-- the funnel each section is answering to. Bars grow in fixed slots, so nothing
         reflows and no guide line shows through a translucent fill. -->
    <text x="560" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">VISITORS REMAINING</text>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.10;0.18;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="118" width="0" height="26" fill="#e6196e" opacity="0.28">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.14;0.30;1" values="0;0;440;440"/>
      </rect>
      <text x="1016" y="136" font-size="11" letter-spacing="1.4" fill="#8a857a">LAND</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.22;0.30;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="178" width="0" height="26" fill="#e6196e" opacity="0.52">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.26;0.42;1" values="0;0;340;340"/>
      </rect>
      <text x="916" y="196" font-size="11" letter-spacing="1.4" fill="#8a857a">READ</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.34;0.42;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="238" width="0" height="26" fill="#e6196e" opacity="0.76">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.38;0.54;1" values="0;0;240;240"/>
      </rect>
      <text x="816" y="256" font-size="11" letter-spacing="1.4" fill="#8a857a">TRUST</text>
    </g>

    <!-- the CTA is what the funnel narrows to -->
    <path d="M460,306 H510 V310 H560" fill="none" stroke="#e6196e" stroke-width="1.5"
          stroke-dasharray="104" stroke-dashoffset="104">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.48;0.62;0.95;1" values="104;104;0;0;104"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.62;0.74;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="297" width="0" height="26" fill="#e6196e">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
                 keyTimes="0;0.62;0.76;1" values="0;0;140;140"/>
      </rect>
      <text x="716" y="315" font-size="11" letter-spacing="1.4" fill="#e6196e">CONVERT</text>
    </g>
  </g>
</svg>
