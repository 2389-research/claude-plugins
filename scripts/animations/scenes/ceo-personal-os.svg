<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">CEO-PERSONAL-OS</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">INTAKE · ALLOCATE · REFLECT · REPEAT</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M260,120 H340 V128 H420"/>
      <path d="M260,172 H340 V208 H420"/>
      <path d="M260,224 H340 V128 H420"/>
      <path d="M260,276 H340 V284 H420"/>
      <path d="M660,208 H760"/>
      <path d="M850,254 V330 H160 V296"/>
    </g>

    <!-- what lands on the desk -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <text x="60" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">INBOX</text>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="60" y="100" width="200" height="40"/>
        <rect x="60" y="152" width="200" height="40"/>
        <rect x="60" y="204" width="200" height="40"/>
        <rect x="60" y="256" width="200" height="40"/>
      </g>
      <g font-size="11" letter-spacing="1.2" fill="#33302a">
        <text x="78" y="125">board deck</text>
        <text x="78" y="177">1:1 with sam</text>
        <text x="78" y="229">hiring loop</text>
        <text x="78" y="281">quarter goals</text>
      </g>
    </g>

    <!-- the three lanes everything has to fit into -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.06;0.14;0.95;1" values="0;0;1;1;0"/>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="420" y="100" width="240" height="56"/>
        <rect x="420" y="180" width="240" height="56"/>
        <rect x="420" y="256" width="240" height="56"/>
      </g>
      <g font-size="12" letter-spacing="1.4" fill="#171512" text-anchor="middle">
        <text x="540" y="133">BUILD</text>
        <text x="540" y="213">PEOPLE</text>
        <text x="540" y="289">THINK</text>
      </g>
    </g>

    <!-- sorting: two items go to BUILD, one to PEOPLE, one to THINK -->
    <g fill="#1f9e6b">
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.16;0.17;0.30;0.32;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.16;0.31;1" keyPoints="0;0;1;1"
                       path="M260,120 H340 V128 H420"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.19;0.20;0.33;0.35;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.19;0.34;1" keyPoints="0;0;1;1"
                       path="M260,172 H340 V208 H420"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.22;0.23;0.36;0.38;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.22;0.37;1" keyPoints="0;0;1;1"
                       path="M260,224 H340 V128 H420"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.25;0.26;0.39;0.41;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.25;0.40;1" keyPoints="0;0;1;1"
                       path="M260,276 H340 V284 H420"/>
      </circle>
    </g>

    <!-- allocated: the lanes carry weight now -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.40;0.50;0.95;1" values="0;0;1;1;0"/>
      <rect x="420" y="100" width="240" height="56" fill="#1f9e6b" opacity="0.18"/>
      <rect x="420" y="180" width="240" height="56" fill="#1f9e6b" opacity="0.10"/>
      <rect x="420" y="256" width="240" height="56" fill="#1f9e6b" opacity="0.10"/>
      <g font-size="11" letter-spacing="1.2" fill="#1f9e6b" text-anchor="end">
        <text x="644" y="118">2</text>
        <text x="644" y="198">1</text>
        <text x="644" y="274">1</text>
      </g>
    </g>

    <path d="M660,208 H760" fill="none" stroke="#1f9e6b" stroke-width="1.5"
          stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.52;0.62;0.95;1" values="100;100;0;0;100"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.60;0.70;0.95;1" values="0;0;1;1;0"/>
      <rect x="760" y="164" width="180" height="90" fill="#1f9e6b"/>
      <text x="850" y="205" font-size="12" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">REFLECT</text>
      <text x="850" y="227" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">weekly</text>
    </g>

    <!-- and the loop closes: reflection changes what gets let in -->
    <path d="M850,254 V330 H160 V296" fill="none" stroke="#1f9e6b" stroke-width="1.5"
          stroke-dasharray="800" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.72;0.88;0.95;1" values="800;800;0;0;800"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.84;0.92;0.95;1" values="0;0;1;1;0"/>
      <text x="1140" y="326" font-size="11" letter-spacing="1.4" fill="#1f9e6b" text-anchor="end">CHANGES WHAT GETS IN</text>
    </g>

    <!-- the constraint that makes it an operating system -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.44;0.54;0.95;1" values="0;0;1;1;0"/>
      <text x="990" y="112" font-size="11" letter-spacing="1.4" fill="#8a857a">FIXED CAPACITY</text>
      <rect x="990" y="122" width="150" height="18" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <rect x="990" y="122" width="112" height="18" fill="#1f9e6b" opacity="0.5"/>
      <text x="990" y="272" font-size="11" letter-spacing="1.2" fill="#8a857a">SAYING YES COSTS</text>
      <text x="990" y="290" font-size="11" letter-spacing="1.2" fill="#8a857a">SOMETHING ELSE</text>
    </g>
  </g>
</svg>
