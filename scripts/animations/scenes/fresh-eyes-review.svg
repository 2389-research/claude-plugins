<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">FRESH-EYES-REVIEW</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">SWEEP THE DIFF · FLAG WHAT THE TESTS MISSED · HOLD THE COMMIT</text>

    <!-- the diff, allocated up front -->
    <rect x="60" y="100" width="560" height="230" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="60" y="94" font-size="11" letter-spacing="1.4" fill="#767168">DIFF</text>
    <g fill="#e7e3da">
      <rect x="90" y="124" width="380" height="14"/>
      <rect x="90" y="152" width="470" height="14"/>
      <rect x="90" y="180" width="300" height="14"/>
      <rect x="90" y="208" width="440" height="14"/>
      <rect x="90" y="236" width="350" height="14"/>
      <rect x="90" y="264" width="410" height="14"/>
      <rect x="90" y="292" width="260" height="14"/>
    </g>

    <!-- the sweep -->
    <rect x="60" y="100" width="3" height="230" fill="#2f7d8c" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.08;0.10;0.40;0.44;1" values="0;0;1;1;0;0"/>
      <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.08;0.42;1" values="60;60;617;617"/>
    </rect>

    <!-- two findings the suite would have let through -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.30;0.40;0.95;1" values="0;0;1;1;0"/>
      <rect x="78" y="148" width="4" height="22" fill="#2e7b8a"/>
      <rect x="90" y="152" width="470" height="14" fill="#2f7d8c" opacity="0.18"/>
      <text x="574" y="164" font-size="11" letter-spacing="1.2" fill="#2e7b8a">SEC</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.38;0.48;0.95;1" values="0;0;1;1;0"/>
      <rect x="78" y="232" width="4" height="22" fill="#2e7b8a"/>
      <rect x="90" y="236" width="350" height="14" fill="#2f7d8c" opacity="0.18"/>
      <text x="454" y="248" font-size="11" letter-spacing="1.2" fill="#2e7b8a">LOGIC</text>
    </g>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M620,215 H700"/>
      <path d="M840,160 V240"/>
    </g>

    <path d="M620,215 H700" fill="none" stroke="#2f7d8c" stroke-width="1.5"
          stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.50;0.58;0.95;1" values="80;80;0;0;80"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.56;0.66;0.95;1" values="0;0;1;1;0"/>
      <rect x="700" y="112" width="280" height="48" fill="#2f7d8c" opacity="0.12"/>
      <rect x="700" y="112" width="280" height="48" fill="none" stroke="#2f7d8c" stroke-width="3"/>
      <text x="840" y="142" font-size="12" letter-spacing="1.4" fill="#171512" text-anchor="middle">2 FINDINGS</text>
    </g>

    <path d="M840,160 V240" fill="none" stroke="#2f7d8c" stroke-width="1.5"
          stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.64;0.72;0.95;1" values="80;80;0;0;80"/>
    </path>

    <!-- the gate: the commit does not go out yet -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.70;0.80;0.95;1" values="0;0;1;1;0"/>
      <rect x="700" y="240" width="280" height="60" fill="#2e7b8a"/>
      <text x="840" y="276" font-size="12" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">COMMIT HELD</text>
    </g>

    <!-- what a green suite alone would have said -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.14;0.24;0.95;1" values="0;0;1;1;0"/>
      <rect x="1020" y="112" width="120" height="48" fill="#ffffff" stroke="#b5b0a4" stroke-width="1.5"/>
      <text x="1080" y="142" font-size="11" letter-spacing="1.2" fill="#767168" text-anchor="middle">TESTS OK</text>
      <text x="1080" y="182" font-size="11" letter-spacing="1.2" fill="#767168" text-anchor="middle">NOT</text>
      <text x="1080" y="200" font-size="11" letter-spacing="1.2" fill="#767168" text-anchor="middle">ENOUGH</text>
    </g>
  </g>
</svg>
