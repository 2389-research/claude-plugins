<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">REMOTE-SYSTEM-MAINTENANCE</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">SSH · TMUX · DIAGNOSE · REMEDIATE — ON SOMEONE ELSE'S BOX</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M200,200 H380"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <rect x="60" y="170" width="140" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="130" y="205" font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">LOCAL</text>
    </g>

    <path d="M200,200 H380" fill="none" stroke="#c67514" stroke-width="1.5"
          stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.10;0.20;0.95;1" values="180;180;0;0;180"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.14;0.22;0.95;1" values="0;0;1;1;0"/>
      <text x="290" y="188" font-size="11" letter-spacing="1.6" fill="#c67514" text-anchor="middle">SSH</text>
    </g>

    <!-- the remote host, with a tmux session that survives the connection -->
    <rect x="380" y="100" width="760" height="220" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="380" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">REMOTE HOST · UBUNTU</text>
    <rect x="380" y="100" width="760" height="34" fill="#f2efe8"/>
    <line x1="380" y1="134" x2="1140" y2="134" stroke="#171512" stroke-width="1.5"/>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.20;0.28;0.95;1" values="0;0;1;1;0"/>
      <rect x="396" y="106" width="90" height="22" fill="#c67514"/>
      <text x="441" y="122" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">tmux 0</text>
      <text x="500" y="122" font-size="11" letter-spacing="1.2" fill="#8a857a">detachable · survives the drop</text>
    </g>

    <!-- three meters, read in one pass -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.28;0.36;0.95;1" values="0;0;1;1;0"/>
      <g font-size="11" letter-spacing="1.2" fill="#171512">
        <text x="410" y="176">DISK</text>
        <text x="410" y="226">MEM</text>
        <text x="410" y="276">SVC</text>
      </g>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="480" y="162" width="500" height="18"/>
        <rect x="480" y="212" width="500" height="18"/>
        <rect x="480" y="262" width="500" height="18"/>
      </g>
    </g>

    <!-- disk is the problem -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.34;0.42;0.95;1" values="0;0;1;1;0"/>
      <rect x="480" y="162" width="0" height="18" fill="#c67514">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.36;0.46;0.66;0.76;1" values="0;0;470;470;150;150"/>
      </rect>
      <rect x="480" y="212" width="0" height="18" fill="#c67514" opacity="0.4">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.38;0.48;1" values="0;0;190;190"/>
      </rect>
      <rect x="480" y="262" width="0" height="18" fill="#c67514" opacity="0.4">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.40;0.50;1" values="0;0;120;120"/>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.48;0.56;0.68;0.74;1" values="0;0;1;1;0;0"/>
      <rect x="480" y="162" width="500" height="18" fill="none" stroke="#c67514" stroke-width="3"/>
      <text x="1000" y="176" font-size="11" letter-spacing="1.4" fill="#c67514">94% — FLAGGED</text>
    </g>

    <!-- remediated, and the meter proves it -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.74;0.82;0.95;1" values="0;0;1;1;0"/>
      <text x="1000" y="176" font-size="11" letter-spacing="1.4" fill="#171512">30% — CLEARED</text>
      <text x="410" y="312" font-size="11" letter-spacing="1.2" fill="#8a857a">journalctl --vacuum-size=200M</text>
    </g>
  </g>
</svg>
