<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">TEST-KITCHEN</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">ONE SPEC · PARALLEL VARIANTS · ONE WINNER</text>

    <!-- Pre-allocated routes: the layout never reflows as parts arrive. -->
    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M200,210 H330 V130 H460"/>
      <path d="M200,210 H460"/>
      <path d="M200,210 H330 V290 H460"/>
      <path d="M660,210 H920"/>
    </g>

    <!-- spec -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.09;0.95;1" values="0;0;1;1;0"/>
      <rect x="60" y="180" width="140" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="130" y="215" font-size="13" letter-spacing="1.4" fill="#171512" text-anchor="middle">SPEC</text>
    </g>

    <!-- fan-out routes drawing in -->
    <g fill="none" stroke="#2f7d8c" stroke-width="1.5">
      <path d="M200,210 H330 V130 H460" stroke-dasharray="340" stroke-dashoffset="340">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.10;0.26;0.95;1" values="340;340;0;0;340"/>
      </path>
      <path d="M200,210 H460" stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.28;0.95;1" values="260;260;0;0;260"/>
      </path>
      <path d="M200,210 H330 V290 H460" stroke-dasharray="340" stroke-dashoffset="340">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.14;0.30;0.95;1" values="340;340;0;0;340"/>
      </path>
    </g>

    <!-- variant A — dims once B wins -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.24;0.32;0.95;1" values="0;0;1;1;0"/>
      <g opacity="1">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
                 keyTimes="0;0.48;0.56;1" values="1;1;0.34;0.34"/>
        <rect x="460" y="100" width="200" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
        <text x="560" y="135" font-size="13" letter-spacing="1.4" fill="#171512" text-anchor="middle">VARIANT A</text>
      </g>
    </g>

    <!-- variant B — the winner -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.26;0.34;0.95;1" values="0;0;1;1;0"/>
      <rect x="460" y="180" width="200" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="560" y="215" font-size="13" letter-spacing="1.4" fill="#171512" text-anchor="middle">VARIANT B</text>
    </g>

    <!-- winner mark: wash plus a heavier rule, held through the settle -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.46;0.54;0.95;1" values="0;0;1;1;0"/>
      <rect x="460" y="180" width="200" height="60" fill="#2f7d8c" opacity="0.12"/>
      <rect x="460" y="180" width="200" height="60" fill="none" stroke="#2f7d8c" stroke-width="3"/>
      <text x="690" y="196" font-size="12" letter-spacing="1.6" fill="#2e7b8a">PICKED</text>
    </g>

    <!-- variant C — dims once B wins -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.28;0.36;0.95;1" values="0;0;1;1;0"/>
      <g opacity="1">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
                 keyTimes="0;0.48;0.56;1" values="1;1;0.34;0.34"/>
        <rect x="460" y="260" width="200" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
        <text x="560" y="295" font-size="13" letter-spacing="1.4" fill="#171512" text-anchor="middle">VARIANT C</text>
      </g>
    </g>

    <!-- winner route out -->
    <path d="M660,210 H920" fill="none" stroke="#2f7d8c" stroke-width="1.5"
          stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.58;0.72;0.95;1" values="260;260;0;0;260"/>
    </path>

    <!-- shipped -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.70;0.78;0.95;1" values="0;0;1;1;0"/>
      <rect x="920" y="180" width="200" height="60" fill="#2e7b8a"/>
      <text x="1020" y="215" font-size="13" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">SHIPPED</text>
    </g>
  </g>
</svg>
