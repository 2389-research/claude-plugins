<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">TERMINAL-TITLE</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">EMOJI · PROJECT · TOPIC — REWRITTEN AS THE WORK MOVES</text>

    <!-- the window, allocated whole so the title bar never reflows -->
    <rect x="140" y="100" width="920" height="220" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <rect x="140" y="100" width="920" height="44" fill="#f2efe8"/>
    <line x1="140" y1="144" x2="1060" y2="144" stroke="#171512" stroke-width="1.5"/>
    <g fill="#d8d3c8">
      <circle cx="168" cy="122" r="6"/>
      <circle cx="190" cy="122" r="6"/>
      <circle cx="212" cy="122" r="6"/>
    </g>

    <!-- the title assembles one segment at a time -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.06;0.14;0.95;1" values="0;0;1;1;0"/>
      <text x="400" y="128" font-size="15">🚀</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.16;0.24;0.95;1" values="0;0;1;1;0"/>
      <text x="428" y="128" font-size="14" fill="#171512">claude-plugins</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.26;0.34;0.95;1" values="0;0;1;1;0"/>
      <text x="560" y="128" font-size="14" fill="#c67514">— Marketplace JSON</text>
    </g>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M186,240 H420"/>
      <path d="M480,240 H620 V128"/>
    </g>

    <!-- the topic changes because the work changed -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.40;0.48;0.95;1" values="0;0;1;1;0"/>
      <text x="170" y="192" font-size="13" fill="#8a857a">$</text>
      <text x="192" y="192" font-size="13" fill="#33302a">now working on the animations</text>
    </g>

    <path d="M186,240 H420" fill="none" stroke="#c67514" stroke-width="1.5"
          stroke-dasharray="234" stroke-dashoffset="234">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.48;0.56;0.95;1" values="234;234;0;0;234"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.54;0.62;0.95;1" values="0;0;1;1;0"/>
      <rect x="420" y="220" width="60" height="40" fill="#c67514"/>
      <text x="450" y="245" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">SET</text>
    </g>
    <path d="M480,240 H620 V128" fill="none" stroke="#c67514" stroke-width="1.5"
          stroke-dasharray="252" stroke-dashoffset="252">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.62;0.72;0.95;1" values="252;252;0;0;252"/>
    </path>

    <!-- old topic out, new topic in, same slot -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.72;0.80;0.95;1" values="0;0;1;1;0"/>
      <rect x="556" y="112" width="240" height="22" fill="#f2efe8"/>
      <text x="560" y="128" font-size="14" fill="#c67514">— Skill Animations</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.30;0.40;0.95;1" values="0;0;1;1;0"/>
      <text x="700" y="192" font-size="11" letter-spacing="1.4" fill="#8a857a">FIND THE RIGHT WINDOW</text>
      <text x="700" y="212" font-size="11" letter-spacing="1.4" fill="#8a857a">WITHOUT READING IT</text>
    </g>
  </g>
</svg>
