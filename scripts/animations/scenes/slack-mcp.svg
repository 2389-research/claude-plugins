<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">SLACK-MCP</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">CREATE CHANNELS · INVITE PEOPLE · POST — FROM THE AGENT</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M210,210 H280"/>
      <path d="M480,210 H560"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <rect x="60" y="180" width="150" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="135" y="215" font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">AGENT</text>
      <rect x="280" y="180" width="200" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="380" y="215" font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">MCP SERVER</text>
    </g>

    <g fill="none" stroke="#c67514" stroke-width="1.5">
      <path d="M210,210 H280" stroke-dasharray="70" stroke-dashoffset="70">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.20;0.95;1" values="70;70;0;0;70"/>
      </path>
      <path d="M480,210 H560" stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.20;0.28;0.95;1" values="80;80;0;0;80"/>
      </path>
    </g>

    <!-- the workspace, with room for the channel that does not exist yet -->
    <rect x="560" y="100" width="580" height="220" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="560" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">WORKSPACE</text>
    <line x1="740" y1="100" x2="740" y2="320" stroke="#e2ddd2" stroke-width="1.5"/>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.26;0.34;0.95;1" values="0;0;1;1;0"/>
      <g font-size="12" fill="#33302a">
        <text x="580" y="132">#general</text>
        <text x="580" y="176">#eng</text>
      </g>
    </g>

    <!-- a channel gets created, then invited into -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.36;0.46;0.95;1" values="0;0;1;1;0"/>
      <rect x="570" y="204" width="160" height="26" fill="#c67514" opacity="0.16"/>
      <text x="580" y="222" font-size="12" fill="#171512">#launch</text>
      <text x="580" y="250" font-size="11" letter-spacing="1.2" fill="#c67514">CREATED</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.48;0.58;0.95;1" values="0;0;1;1;0"/>
      <g fill="#c67514">
        <circle cx="586" cy="284" r="7"/>
        <circle cx="604" cy="284" r="7"/>
        <circle cx="622" cy="284" r="7"/>
      </g>
      <text x="640" y="288" font-size="11" letter-spacing="1.2" fill="#8a857a">3 INVITED</text>
    </g>

    <!-- and the message lands in it -->
    <circle r="6" fill="#c67514" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.60;0.61;0.72;0.74;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     keyTimes="0;0.60;0.73;1" keyPoints="0;0;1;1"
                     path="M700,217 H780"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.72;0.82;0.95;1" values="0;0;1;1;0"/>
      <rect x="770" y="150" width="340" height="120" fill="#c67514"/>
      <text x="790" y="182" font-size="12" letter-spacing="1.2" fill="#ffffff">#launch</text>
      <g fill="#ffffff" opacity="0.68">
        <rect x="790" y="200" width="280" height="10"/>
        <rect x="790" y="220" width="230" height="10"/>
        <rect x="790" y="240" width="255" height="10"/>
      </g>
    </g>
  </g>
</svg>
