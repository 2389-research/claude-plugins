<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">WORLDVIEW-SYNTHESIS</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">SURFACE BELIEFS · NAME THE TENSION · WRITE THE NARRATIVE</text>

    <!-- the belief field, laid out before anything connects -->
    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M140,140 L300,120"/>
      <path d="M300,120 L460,180"/>
      <path d="M140,140 L200,260"/>
      <path d="M200,260 L380,300"/>
      <path d="M460,180 L380,300"/>
      <path d="M460,180 L620,140"/>
      <path d="M380,300 L620,260"/>
      <path d="M660,200 H760"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.12;0.95;1" values="0;0;1;1;0"/>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <circle cx="140" cy="140" r="9"/>
        <circle cx="300" cy="120" r="9"/>
        <circle cx="460" cy="180" r="9"/>
        <circle cx="200" cy="260" r="9"/>
        <circle cx="380" cy="300" r="9"/>
        <circle cx="620" cy="140" r="9"/>
        <circle cx="620" cy="260" r="9"/>
      </g>
      <g font-size="11" fill="#4a453b">
        <text x="106" y="122">craft</text>
        <text x="278" y="102">scale</text>
        <text x="440" y="162">speed</text>
        <text x="166" y="286">care</text>
        <text x="346" y="326">people</text>
        <text x="600" y="122">margin</text>
        <text x="600" y="286">taste</text>
      </g>
    </g>

    <!-- edges form as the beliefs get stated out loud -->
    <g fill="none" stroke="#1f9e6b" stroke-width="1.5">
      <path d="M140,140 L300,120" stroke-dasharray="162" stroke-dashoffset="162">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.14;0.24;0.95;1" values="162;162;0;0;162"/>
      </path>
      <path d="M300,120 L460,180" stroke-dasharray="171" stroke-dashoffset="171">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.16;0.26;0.95;1" values="171;171;0;0;171"/>
      </path>
      <path d="M140,140 L200,260" stroke-dasharray="134" stroke-dashoffset="134">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.18;0.28;0.95;1" values="134;134;0;0;134"/>
      </path>
      <path d="M200,260 L380,300" stroke-dasharray="184" stroke-dashoffset="184">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.20;0.30;0.95;1" values="184;184;0;0;184"/>
      </path>
      <path d="M460,180 L620,140" stroke-dasharray="165" stroke-dashoffset="165">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.22;0.32;0.95;1" values="165;165;0;0;165"/>
      </path>
      <path d="M380,300 L620,260" stroke-dasharray="243" stroke-dashoffset="243">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.24;0.34;0.95;1" values="243;243;0;0;243"/>
      </path>
    </g>

    <!-- the edge that does not resolve: speed against care -->
    <path d="M460,180 L380,300" fill="none" stroke="#1f9e6b" stroke-width="3"
          stroke-dasharray="144" stroke-dashoffset="144">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.40;0.50;0.95;1" values="144;144;0;0;144"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.50;0.60;0.95;1" values="0;0;1;1;0"/>
      <text x="476" y="232" font-size="11" letter-spacing="1.4" fill="#1f9e6b">TENSION</text>
      <text x="476" y="250" font-size="11" letter-spacing="1.2" fill="#8a857a">not resolved</text>
    </g>

    <path d="M660,200 H760" fill="none" stroke="#1f9e6b" stroke-width="1.5"
          stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.60;0.70;0.95;1" values="100;100;0;0;100"/>
    </path>

    <!-- the narrative the graph adds up to -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.68;0.78;0.95;1" values="0;0;1;1;0"/>
      <rect x="760" y="130" width="380" height="140" fill="#1f9e6b"/>
      <text x="790" y="170" font-size="12" letter-spacing="1.4" fill="#ffffff">NARRATIVE</text>
      <g fill="#ffffff" opacity="0.62">
        <rect x="790" y="192" width="320" height="10"/>
        <rect x="790" y="212" width="280" height="10"/>
        <rect x="790" y="232" width="300" height="10"/>
      </g>
    </g>
  </g>
</svg>
