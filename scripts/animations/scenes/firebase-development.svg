<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">FIREBASE-DEVELOPMENT</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">WRITES VALIDATED SERVER-SIDE · TRIGGER-MAINTAINED READ VIEWS</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M210,210 H260"/>
      <path d="M450,210 H500"/>
      <path d="M690,210 H740"/>
      <path d="M910,210 H960"/>
    </g>

    <!-- stations, pre-allocated -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.09;0.95;1" values="0;0;1;1;0"/>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="60" y="180" width="150" height="60"/>
        <rect x="260" y="180" width="190" height="60"/>
        <rect x="500" y="180" width="190" height="60"/>
        <rect x="740" y="180" width="170" height="60"/>
        <rect x="960" y="180" width="180" height="60"/>
      </g>
      <g font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">
        <text x="135" y="215">CLIENT</text>
        <text x="355" y="215">CALLABLE FN</text>
        <text x="595" y="215">FIRESTORE</text>
        <text x="825" y="215">TRIGGER</text>
        <text x="1050" y="215">READ VIEW</text>
      </g>
    </g>

    <!-- the write travels client → function → firestore -->
    <g stroke="#c67514" stroke-width="1.5" fill="none">
      <path d="M210,210 H260" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.18;0.95;1" values="50;50;0;0;50"/>
      </path>
      <path d="M450,210 H500" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.30;0.36;0.95;1" values="50;50;0;0;50"/>
      </path>
      <path d="M690,210 H740" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.50;0.56;0.95;1" values="50;50;0;0;50"/>
      </path>
      <path d="M910,210 H960" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.64;0.70;0.95;1" values="50;50;0;0;50"/>
      </path>
    </g>

    <circle r="6" fill="#c67514" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.11;0.13;0.34;0.37;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     keyTimes="0;0.11;0.35;1" keyPoints="0;0;1;1"
                     path="M210,210 H595"/>
    </circle>

    <!-- validated on the way through -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.22;0.30;0.95;1" values="0;0;1;1;0"/>
      <rect x="260" y="180" width="190" height="60" fill="#c67514" opacity="0.12"/>
      <rect x="260" y="180" width="190" height="60" fill="none" stroke="#c67514" stroke-width="3"/>
      <text x="355" y="164" font-size="11" letter-spacing="1.4" fill="#a56111" text-anchor="middle">VALIDATED</text>
    </g>

    <!-- persisted -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.38;0.46;0.95;1" values="0;0;1;1;0"/>
      <rect x="500" y="180" width="190" height="60" fill="#c67514" opacity="0.12"/>
      <rect x="500" y="180" width="190" height="60" fill="none" stroke="#c67514" stroke-width="3"/>
      <text x="595" y="164" font-size="11" letter-spacing="1.4" fill="#a56111" text-anchor="middle">WRITTEN</text>
    </g>

    <!-- trigger fires -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.56;0.64;0.95;1" values="0;0;1;1;0"/>
      <rect x="740" y="180" width="170" height="60" fill="none" stroke="#c67514" stroke-width="3"/>
      <text x="825" y="164" font-size="11" letter-spacing="1.4" fill="#a56111" text-anchor="middle">FIRED</text>
    </g>

    <!-- denormalized read view, the only thing clients read -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.70;0.79;0.95;1" values="0;0;1;1;0"/>
      <rect x="960" y="180" width="180" height="60" fill="#a56111"/>
      <text x="1050" y="215" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">READ VIEW</text>
      <text x="1050" y="164" font-size="11" letter-spacing="1.4" fill="#a56111" text-anchor="middle">REBUILT</text>
    </g>
  </g>
</svg>
