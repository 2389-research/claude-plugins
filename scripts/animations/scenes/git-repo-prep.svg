<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">GIT-REPO-PREP</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">AUDIT · REMOVE WHAT SHOULD NOT SHIP · ADD WHAT MUST · THEN PUBLIC</text>

    <rect x="60" y="100" width="400" height="220" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="60" y="94" font-size="11" letter-spacing="1.4" fill="#8a857a">REPO</text>
    <g font-size="12" fill="#33302a">
      <text x="84" y="136">src/</text>
      <text x="84" y="176">.env</text>
      <text x="84" y="216">config/keys.json</text>
      <text x="84" y="256">LICENSE</text>
      <text x="84" y="296">README.md</text>
    </g>

    <!-- the audit sweep -->
    <rect x="60" y="100" width="3" height="220" fill="#e6196e" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.04;0.06;0.24;0.28;1" values="0;0;1;1;0;0"/>
      <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.04;0.26;1" values="60;60;457;457"/>
    </rect>

    <!-- two things flagged -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.22;0.32;0.95;1" values="0;0;1;1;0"/>
      <rect x="76" y="160" width="240" height="22" fill="#e6196e" opacity="0.18"/>
      <rect x="76" y="200" width="240" height="22" fill="#e6196e" opacity="0.18"/>
    </g>
    <!-- the flag label hands the slot over to the outcome label -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.24;0.32;0.40;1" values="0;0;1;0;0"/>
      <text x="330" y="176" font-size="11" letter-spacing="1.2" fill="#e6196e">SECRET</text>
      <text x="330" y="216" font-size="11" letter-spacing="1.2" fill="#e6196e">SECRET</text>
    </g>

    <!-- and struck out: they do not travel with the repo -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.42;0.52;0.95;1" values="0;0;1;1;0"/>
      <g stroke="#171512" stroke-width="2">
        <line x1="80" y1="172" x2="240" y2="172"/>
        <line x1="80" y1="212" x2="240" y2="212"/>
      </g>
      <text x="330" y="176" font-size="11" letter-spacing="1.2" fill="#171512">PURGED</text>
      <text x="330" y="216" font-size="11" letter-spacing="1.2" fill="#171512">PURGED</text>
    </g>

    <!-- and two things that were missing get written -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.46;0.56;0.95;1" values="0;0;1;1;0"/>
      <rect x="76" y="240" width="240" height="22" fill="#e6196e" opacity="0.12"/>
      <rect x="76" y="280" width="240" height="22" fill="#e6196e" opacity="0.12"/>
      <text x="330" y="256" font-size="11" letter-spacing="1.2" fill="#e6196e">WRITTEN</text>
      <text x="330" y="296" font-size="11" letter-spacing="1.2" fill="#e6196e">WRITTEN</text>
    </g>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M460,210 H540"/>
      <path d="M800,210 H880"/>
    </g>

    <path d="M460,210 H540" fill="none" stroke="#e6196e" stroke-width="1.5"
          stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.30;0.38;0.95;1" values="80;80;0;0;80"/>
    </path>

    <!-- the checklist, ticked as each item is handled -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.32;0.42;0.95;1" values="0;0;1;1;0"/>
      <rect x="540" y="130" width="260" height="160" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="560" y="158" font-size="11" letter-spacing="1.4" fill="#8a857a">OPENNESS CHECKS</text>
      <g font-size="12" fill="#33302a">
        <text x="584" y="192">secrets</text>
        <text x="584" y="222">license</text>
        <text x="584" y="252">docs</text>
      </g>
      <g fill="none" stroke="#d8d3c8" stroke-width="1.5">
        <rect x="560" y="182" width="14" height="14"/>
        <rect x="560" y="212" width="14" height="14"/>
        <rect x="560" y="242" width="14" height="14"/>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.50;0.58;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="182" width="14" height="14" fill="#e6196e"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.56;0.64;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="212" width="14" height="14" fill="#e6196e"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.62;0.70;0.95;1" values="0;0;1;1;0"/>
      <rect x="560" y="242" width="14" height="14" fill="#e6196e"/>
    </g>

    <path d="M800,210 H880" fill="none" stroke="#e6196e" stroke-width="1.5"
          stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.68;0.76;0.95;1" values="80;80;0;0;80"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.74;0.84;0.95;1" values="0;0;1;1;0"/>
      <rect x="880" y="180" width="260" height="60" fill="#e6196e"/>
      <text x="1010" y="216" font-size="12" letter-spacing="1.6" fill="#ffffff" text-anchor="middle">SAFE TO PUBLISH</text>
    </g>
  </g>
</svg>
