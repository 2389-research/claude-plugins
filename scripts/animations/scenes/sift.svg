<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">SIFT</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">READ THE WHOLE TREE · FLAG WHAT COLLAPSES · CHANGE NOTHING</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M400,212 H700"/>
    </g>

    <!-- the tree, read in full and left exactly as it was found -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <text x="100" y="118" font-size="11" letter-spacing="1.6" fill="#767168">CODEBASE</text>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="100" y="140" width="56" height="24"/>
        <rect x="180" y="140" width="56" height="24"/>
        <rect x="260" y="140" width="56" height="24"/>
        <rect x="340" y="140" width="56" height="24"/>
        <rect x="100" y="180" width="56" height="24"/>
        <rect x="180" y="180" width="56" height="24"/>
        <rect x="260" y="180" width="56" height="24"/>
        <rect x="340" y="180" width="56" height="24"/>
        <rect x="100" y="220" width="56" height="24"/>
        <rect x="180" y="220" width="56" height="24"/>
        <rect x="260" y="220" width="56" height="24"/>
        <rect x="340" y="220" width="56" height="24"/>
        <rect x="100" y="260" width="56" height="24"/>
        <rect x="180" y="260" width="56" height="24"/>
        <rect x="260" y="260" width="56" height="24"/>
        <rect x="340" y="260" width="56" height="24"/>
      </g>
    </g>

    <!-- the sweep: every file is read, not a sample -->
    <line x1="92" y1="132" x2="92" y2="292" stroke="#2f7d8c" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.12;0.14;0.30;0.32;1" values="0;0;1;1;0;0"/>
      <animate attributeName="x1" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.12;0.30;0.95;1" values="92;92;404;404;92"/>
      <animate attributeName="x2" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.12;0.30;0.95;1" values="92;92;404;404;92"/>
    </line>

    <!-- three places where structure collapses, marked in the tree itself -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.32;0.42;0.95;1" values="0;0;1;1;0"/>
      <g fill="#2f7d8c" opacity="0.12">
        <rect x="180" y="180" width="56" height="24"/>
        <rect x="100" y="220" width="56" height="24"/>
        <rect x="340" y="260" width="56" height="24"/>
      </g>
      <g fill="none" stroke="#2f7d8c" stroke-width="3">
        <rect x="180" y="180" width="56" height="24"/>
        <rect x="100" y="220" width="56" height="24"/>
        <rect x="340" y="260" width="56" height="24"/>
      </g>
    </g>

    <!-- findings travel out; the tree does not -->
    <path d="M400,212 H700" fill="none" stroke="#2f7d8c" stroke-width="1.5"
          stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.44;0.56;0.95;1" values="300;300;0;0;300"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.58;0.68;0.95;1" values="0;0;1;1;0"/>
      <text x="700" y="118" font-size="11" letter-spacing="1.6" fill="#767168">SIMPLIFICATIONS</text>
      <rect x="700" y="140" width="400" height="124" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <g font-size="11" letter-spacing="1.2" fill="#171512">
        <text x="720" y="172">STATE · two stores hold one truth</text>
        <text x="720" y="206">CONTROL FLOW · a branch that cannot run</text>
        <text x="720" y="240">OWNERSHIP · a boundary drawn twice</text>
      </g>
    </g>

    <!-- the outcome is a report, never an edit -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.72;0.82;0.95;1" values="0;0;1;1;0"/>
      <rect x="700" y="280" width="400" height="40" fill="#2e7b8a"/>
      <text x="900" y="305" font-size="12" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">READ-ONLY · NO FILE CHANGED</text>
    </g>
  </g>
</svg>
