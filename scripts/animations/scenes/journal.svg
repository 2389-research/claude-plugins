<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">JOURNAL</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">PROCESS THE THOUGHT · KEEP IT PRIVATE · FIND IT AGAIN</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M280,120 H360 V160 H440"/>
      <path d="M280,176 H360 V200 H440"/>
      <path d="M280,232 H360 V240 H440"/>
      <path d="M280,288 H360 V280 H440"/>
      <path d="M800,150 H880"/>
      <path d="M880,280 H800"/>
    </g>

    <!-- unsorted thoughts -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <text x="60" y="88" font-size="11" letter-spacing="1.4" fill="#8a857a">RAW</text>
      <g font-size="11" fill="#4a453b">
        <text x="60" y="124">what went wrong there</text>
        <text x="60" y="180">pattern I keep hitting</text>
        <text x="60" y="236">how they work</text>
        <text x="60" y="292">felt good, unsure why</text>
      </g>
    </g>

    <g fill="#1f9e6b">
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.13;0.25;0.27;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.12;0.26;1" keyPoints="0;0;1;1"
                       path="M280,120 H360 V160 H440"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.15;0.16;0.27;0.29;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.15;0.28;1" keyPoints="0;0;1;1"
                       path="M280,176 H360 V200 H440"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.18;0.19;0.29;0.31;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.18;0.30;1" keyPoints="0;0;1;1"
                       path="M280,232 H360 V240 H440"/>
      </circle>
      <circle r="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.21;0.22;0.31;0.33;1" values="0;0;1;1;0;0"/>
        <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                       keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                       keyTimes="0;0.21;0.32;1" keyPoints="0;0;1;1"
                       path="M280,288 H360 V280 H440"/>
      </circle>
    </g>

    <!-- the entry, sectioned the way the tool sections it -->
    <rect x="440" y="100" width="360" height="220" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
    <text x="440" y="88" font-size="11" letter-spacing="1.4" fill="#8a857a">ENTRY</text>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.28;0.40;0.95;1" values="0;0;1;1;0"/>
      <g font-size="11" letter-spacing="1.2" fill="#1f9e6b">
        <text x="462" y="134">PROJECT NOTES</text>
        <text x="462" y="196">TECHNICAL INSIGHTS</text>
        <text x="462" y="258">FEELINGS</text>
      </g>
      <g fill="#e7e3da">
        <rect x="462" y="144" width="316" height="8"/>
        <rect x="462" y="158" width="270" height="8"/>
        <rect x="462" y="206" width="300" height="8"/>
        <rect x="462" y="220" width="240" height="8"/>
        <rect x="462" y="268" width="290" height="8"/>
        <rect x="462" y="282" width="200" height="8"/>
      </g>
    </g>

    <path d="M800,150 H880" fill="none" stroke="#1f9e6b" stroke-width="1.5"
          stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.44;0.52;0.95;1" values="80;80;0;0;80"/>
    </path>

    <!-- stays on the machine -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.52;0.62;0.95;1" values="0;0;1;1;0"/>
      <rect x="880" y="120" width="260" height="60" fill="#1f9e6b"/>
      <text x="1010" y="156" font-size="12" letter-spacing="1.4" fill="#ffffff" text-anchor="middle">PRIVATE · LOCAL</text>
    </g>

    <!-- and comes back when it is needed -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.60;0.70;0.95;1" values="0;0;1;1;0"/>
      <rect x="880" y="250" width="260" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="1010" y="286" font-size="12" letter-spacing="1.4" fill="#171512" text-anchor="middle">SEARCH</text>
    </g>
    <circle r="5" fill="#1f9e6b" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.72;0.73;0.84;0.86;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     keyTimes="0;0.72;0.85;1" keyPoints="0;0;1;1"
                     path="M880,280 H800"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.84;0.92;0.95;1" values="0;0;1;1;0"/>
      <rect x="462" y="268" width="290" height="8" fill="#1f9e6b"/>
      <text x="462" y="306" font-size="11" letter-spacing="1.2" fill="#1f9e6b">RECALLED</text>
    </g>
  </g>
</svg>
