<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#767168">AGENT-ERGO</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#767168">WALK THE AGENT LOOP · FLAG FRICTION · REVISE SPECS AND PLANS</text>

    <!-- every route is drawn faint from frame one, so the layout never reflows -->
    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M180,150 H220"/>
      <path d="M340,150 H380"/>
      <path d="M500,150 H540"/>
      <path d="M660,150 H700"/>
      <path d="M820,150 H860"/>
      <path d="M980,150 H1020"/>
      <path d="M280,180 V220"/>
      <path d="M600,180 V220"/>
      <path d="M760,180 V220"/>
      <path d="M920,180 V220"/>
      <path d="M1080,180 V320 H120 V180"/>
    </g>

    <!-- the walk lights the row behind the stations, keyed to the agent so the trail ends where it stands -->
    <path d="M180,150 H1020" fill="none" stroke="#7a3fb0" stroke-width="1.5"
          stroke-dasharray="840" stroke-dashoffset="840">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.12;0.14;0.19;0.24;0.29;0.32;0.37;0.40;0.45;0.48;0.95;1"
               values="840;840;810;810;490;490;330;330;170;170;0;0;840"/>
    </path>

    <!-- the specs and plans, allocated up front -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.04;0.12;0.95;1" values="0;0;1;1;0"/>
      <text x="160" y="214" font-size="11" letter-spacing="1.4" fill="#767168">SPECS · PLANS</text>
      <rect x="160" y="220" width="880" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <g fill="#e2ddd2">
        <rect x="180" y="240" width="120" height="8"/>
        <rect x="320" y="240" width="200" height="8"/>
        <rect x="540" y="240" width="120" height="8"/>
        <rect x="680" y="240" width="220" height="8"/>
        <rect x="920" y="240" width="100" height="8"/>
        <rect x="180" y="260" width="80" height="8"/>
        <rect x="280" y="260" width="200" height="8"/>
        <rect x="500" y="260" width="200" height="8"/>
        <rect x="720" y="260" width="120" height="8"/>
        <rect x="860" y="260" width="100" height="8"/>
      </g>
    </g>

    <!-- the operator loop an agent has to get through -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="60" y="120" width="120" height="60"/>
        <rect x="220" y="120" width="120" height="60"/>
        <rect x="380" y="120" width="120" height="60"/>
        <rect x="540" y="120" width="120" height="60"/>
        <rect x="700" y="120" width="120" height="60"/>
        <rect x="860" y="120" width="120" height="60"/>
        <rect x="1020" y="120" width="120" height="60"/>
      </g>
      <g font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">
        <text x="120" y="155">ORIENT</text>
        <text x="280" y="155">OBSERVE</text>
        <text x="440" y="155">DECIDE</text>
        <text x="600" y="155">ACT</text>
        <text x="760" y="155">VERIFY</text>
        <text x="920" y="155">RECOVER</text>
        <text x="1080" y="155">LEARN</text>
      </g>
    </g>

    <!-- friction: the agent stalls at a door, and that step is flagged -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.14;0.22;0.95;1" values="0;0;1;1;0"/>
      <rect x="220" y="120" width="120" height="60" fill="#7a3fb0" opacity="0.12"/>
      <rect x="220" y="120" width="120" height="60" fill="none" stroke="#7a3fb0" stroke-width="3"/>
      <text x="280" y="104" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">HIDDEN STATE</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.24;0.32;0.95;1" values="0;0;1;1;0"/>
      <rect x="540" y="120" width="120" height="60" fill="#7a3fb0" opacity="0.12"/>
      <rect x="540" y="120" width="120" height="60" fill="none" stroke="#7a3fb0" stroke-width="3"/>
      <text x="600" y="104" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">NO PREVIEW</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.32;0.40;0.95;1" values="0;0;1;1;0"/>
      <rect x="700" y="120" width="120" height="60" fill="#7a3fb0" opacity="0.12"/>
      <rect x="700" y="120" width="120" height="60" fill="none" stroke="#7a3fb0" stroke-width="3"/>
      <text x="760" y="104" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">NO CHECK</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.40;0.48;0.95;1" values="0;0;1;1;0"/>
      <rect x="860" y="120" width="120" height="60" fill="#7a3fb0" opacity="0.12"/>
      <rect x="860" y="120" width="120" height="60" fill="none" stroke="#7a3fb0" stroke-width="3"/>
      <text x="920" y="104" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">NO UNDO</text>
    </g>

    <!-- the agent: stalls at the door of each step that trips it, then walks on to LEARN -->
    <circle r="5" fill="#7a3fb0" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.10;0.12;0.48;0.50;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     path="M180,150 H1020" keyTimes="0;0.12;0.14;0.19;0.24;0.29;0.32;0.37;0.40;0.45;0.48;1"
                     keyPoints="0;0;0.0357;0.0357;0.4167;0.4167;0.6071;0.6071;0.7976;0.7976;1;1"/>
    </circle>

    <!-- one coordinated pass: each friction point becomes an edit in the specs and plans -->
    <g fill="none" stroke="#7a3fb0" stroke-width="1.5">
      <path d="M280,180 V220" stroke-dasharray="40" stroke-dashoffset="40">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.50;0.56;0.95;1" values="40;40;0;0;40"/>
      </path>
      <path d="M600,180 V220" stroke-dasharray="40" stroke-dashoffset="40">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.52;0.58;0.95;1" values="40;40;0;0;40"/>
      </path>
      <path d="M760,180 V220" stroke-dasharray="40" stroke-dashoffset="40">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.54;0.60;0.95;1" values="40;40;0;0;40"/>
      </path>
      <path d="M920,180 V220" stroke-dasharray="40" stroke-dashoffset="40">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.56;0.62;0.95;1" values="40;40;0;0;40"/>
      </path>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.56;0.64;0.95;1" values="0;0;1;1;0"/>
      <rect x="220" y="220" width="120" height="60" fill="#7a3fb0"/>
      <text x="280" y="255" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">STATE QUERY</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.58;0.66;0.95;1" values="0;0;1;1;0"/>
      <rect x="540" y="220" width="120" height="60" fill="#7a3fb0"/>
      <text x="600" y="255" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">DRY RUN</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.60;0.68;0.95;1" values="0;0;1;1;0"/>
      <rect x="700" y="220" width="120" height="60" fill="#7a3fb0"/>
      <text x="760" y="255" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">ACCEPT TEST</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.62;0.70;0.95;1" values="0;0;1;1;0"/>
      <rect x="860" y="220" width="120" height="60" fill="#7a3fb0"/>
      <text x="920" y="255" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">ROLLBACK</text>
    </g>

    <!-- and around: what the run learned feeds the next one's orientation -->
    <path d="M1080,180 V320 H120 V180" fill="none" stroke="#7a3fb0" stroke-width="1.5"
          stroke-dasharray="1240" stroke-dashoffset="1240">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.70;0.82;0.95;1" values="1240;1240;0;0;1240"/>
    </path>
    <circle r="5" fill="#7a3fb0" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.68;0.70;0.82;0.84;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     path="M1080,180 V320 H120 V180" keyTimes="0;0.70;0.82;1" keyPoints="0;0;1;1"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.80;0.88;0.95;1" values="0;0;1;1;0"/>
      <text x="600" y="306" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">REUSE PAST WORK</text>
    </g>
  </g>
</svg>
