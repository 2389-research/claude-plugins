<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">SPEED-RUN</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">PLAN LOCALLY · BUILD IN PARALLEL ON A HOSTED LLM · SPEND FEW TOKENS</text>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M210,210 H280 V134 H340"/>
      <path d="M210,210 H340"/>
      <path d="M210,210 H280 V286 H340"/>
      <path d="M530,134 H600 V210 H660"/>
      <path d="M530,210 H660"/>
      <path d="M530,286 H600 V210 H660"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.10;0.95;1" values="0;0;1;1;0"/>
      <rect x="60" y="180" width="150" height="60" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="135" y="215" font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">PLAN</text>
    </g>

    <g fill="none" stroke="#e6196e" stroke-width="1.5">
      <path d="M210,210 H280 V134 H340" stroke-dasharray="206" stroke-dashoffset="206">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.22;0.95;1" values="206;206;0;0;206"/>
      </path>
      <path d="M210,210 H340" stroke-dasharray="130" stroke-dashoffset="130">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.22;0.95;1" values="130;130;0;0;130"/>
      </path>
      <path d="M210,210 H280 V286 H340" stroke-dasharray="206" stroke-dashoffset="206">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.12;0.22;0.95;1" values="206;206;0;0;206"/>
      </path>
    </g>

    <!-- three hosted workers, all firing at once -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.22;0.32;0.95;1" values="0;0;1;1;0"/>
      <g fill="#ffffff" stroke="#171512" stroke-width="1.5">
        <rect x="340" y="110" width="190" height="48"/>
        <rect x="340" y="186" width="190" height="48"/>
        <rect x="340" y="262" width="190" height="48"/>
      </g>
      <g font-size="12" letter-spacing="1.2" fill="#171512" text-anchor="middle">
        <text x="435" y="140">WORKER 1</text>
        <text x="435" y="216">WORKER 2</text>
        <text x="435" y="292">WORKER 3</text>
      </g>
      <text x="435" y="98" font-size="11" letter-spacing="1.6" fill="#8a857a" text-anchor="middle">HOSTED · CEREBRAS</text>
    </g>

    <!-- all three land at once: that is the speed -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.36;0.44;0.95;1" values="0;0;1;1;0"/>
      <rect x="340" y="110" width="190" height="48" fill="#e6196e" opacity="0.12"/>
      <rect x="340" y="186" width="190" height="48" fill="#e6196e" opacity="0.12"/>
      <rect x="340" y="262" width="190" height="48" fill="#e6196e" opacity="0.12"/>
      <g fill="none" stroke="#e6196e" stroke-width="3">
        <rect x="340" y="110" width="190" height="48"/>
        <rect x="340" y="186" width="190" height="48"/>
        <rect x="340" y="262" width="190" height="48"/>
      </g>
    </g>

    <g fill="none" stroke="#e6196e" stroke-width="1.5">
      <path d="M530,134 H600 V210 H660" stroke-dasharray="206" stroke-dashoffset="206">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.60;0.95;1" values="206;206;0;0;206"/>
      </path>
      <path d="M530,210 H660" stroke-dasharray="130" stroke-dashoffset="130">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.60;0.95;1" values="130;130;0;0;130"/>
      </path>
      <path d="M530,286 H600 V210 H660" stroke-dasharray="206" stroke-dashoffset="206">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                 keyTimes="0;0.48;0.60;0.95;1" values="206;206;0;0;206"/>
      </path>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.60;0.70;0.95;1" values="0;0;1;1;0"/>
      <rect x="660" y="180" width="170" height="60" fill="#e6196e"/>
      <text x="745" y="215" font-size="12" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">MERGED</text>
    </g>

    <!-- the point of the exercise: the local budget barely moves -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.08;0.18;0.95;1" values="0;0;1;1;0"/>
      <text x="900" y="192" font-size="11" letter-spacing="1.6" fill="#8a857a">LOCAL TOKENS SPENT</text>
      <rect x="900" y="204" width="220" height="18" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <rect x="900" y="204" width="0" height="18" fill="#e6196e">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
                 keyTimes="0;0.22;0.72;1" values="0;0;46;46"/>
      </rect>
      <text x="900" y="248" font-size="11" letter-spacing="1.4" fill="#8a857a">HEAVY LIFTING RUNS OFF-BUDGET</text>
    </g>
  </g>
</svg>
