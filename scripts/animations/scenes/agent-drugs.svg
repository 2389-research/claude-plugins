<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#faf9f6"/>
  <g font-family="Menlo, 'IBM Plex Mono', monospace">
    <text x="60" y="52" font-size="13" letter-spacing="2.2" fill="#8a857a">AGENT-DRUGS</text>
    <line x1="60" y1="76" x2="1140" y2="76" stroke="#e2ddd2" stroke-width="1.5"/>
    <text x="60" y="366" font-size="12" letter-spacing="1.6" fill="#8a857a">BASELINE · DOSE · A DIFFERENT SHAPE OF THINKING</text>

    <text x="60" y="120" font-size="11" letter-spacing="1.4" fill="#8a857a">BASELINE</text>
    <text x="880" y="120" font-size="11" letter-spacing="1.4" fill="#7a3fb0">ALTERED</text>

    <!-- the even baseline -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.02;0.12;0.95;1" values="0;0;1;1;0"/>
      <path d="M60,240 Q105,216 150,240 Q195,264 240,240 Q285,216 330,240 Q375,264 420,240"
            fill="none" stroke="#171512" stroke-width="2"/>
    </g>

    <g stroke="#d8d3c8" stroke-width="1.5" stroke-dasharray="2 6" fill="none">
      <path d="M420,240 H480"/>
      <path d="M300,150 C420,150 500,196 540,196"/>
      <path d="M720,240 H780"/>
    </g>

    <path d="M420,240 H480" fill="none" stroke="#7a3fb0" stroke-width="1.5"
          stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.14;0.20;0.95;1" values="60;60;0;0;60"/>
    </path>

    <!-- the agent, unchanged until something is put into its context -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.06;0.16;0.95;1" values="0;0;1;1;0"/>
      <rect x="480" y="196" width="240" height="88" fill="#ffffff" stroke="#171512" stroke-width="1.5"/>
      <text x="600" y="248" font-size="12" letter-spacing="1.4" fill="#171512" text-anchor="middle">AGENT</text>
    </g>

    <!-- the dose: a capsule of prompt, arriving from outside -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.16;0.24;0.95;1" values="0;0;1;1;0"/>
      <rect x="180" y="134" width="120" height="32" rx="16" fill="#7a3fb0"/>
      <text x="240" y="155" font-size="11" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">DOSE</text>
    </g>
    <circle r="7" fill="#7a3fb0" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.28;0.30;0.44;0.46;1" values="0;0;1;1;0;0"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
                     keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
                     keyTimes="0;0.28;0.45;1" keyPoints="0;0;1;1"
                     path="M300,150 C420,150 500,196 540,196"/>
    </circle>

    <!-- taken up, and it stays taken up -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.46;0.56;0.95;1" values="0;0;1;1;0"/>
      <rect x="480" y="196" width="240" height="88" fill="#7a3fb0" opacity="0.16"/>
      <rect x="480" y="196" width="240" height="88" fill="none" stroke="#7a3fb0" stroke-width="3"/>
      <text x="600" y="272" font-size="11" letter-spacing="1.4" fill="#7a3fb0" text-anchor="middle">IN CONTEXT</text>
    </g>

    <path d="M720,240 H780" fill="none" stroke="#7a3fb0" stroke-width="1.5"
          stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1;0.42 0 0.16 1"
               keyTimes="0;0.58;0.64;0.95;1" values="60;60;0;0;60"/>
    </path>

    <!-- same signal, different character -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.64;0.76;0.95;1" values="0;0;1;1;0"/>
      <path d="M780,240 Q800,170 820,240 Q840,300 860,240 Q890,140 920,240 Q940,290 960,240 Q990,160 1020,240 Q1050,300 1080,240 Q1110,196 1140,240"
            fill="none" stroke="#7a3fb0" stroke-width="2"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keySplines="0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1;0.22 0.9 0.3 1"
               keyTimes="0;0.76;0.86;0.95;1" values="0;0;1;1;0"/>
      <text x="880" y="320" font-size="11" letter-spacing="1.2" fill="#8a857a">SAME MODEL · DIFFERENT BEHAVIOUR</text>
    </g>
  </g>
</svg>
